[package]
name = "rtc-srtp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rtc-srtp]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "context_decrypt"
path = "fuzz_targets/context_decrypt.rs"
test = false
doc = false
bench = false
