[workspace]
members = [
    "rtci-crypto",
    "rtci-datachannel",
    "rtci-dtls",
    "rtci-ice",
    "rtci-interceptor",
    "rtci-interceptor-derive",
    "rtci-media",
    "rtci-mdns",
    "rtci-rtcp",
    "rtci-rtp",
    "rtci-sctp",
    "rtci-sdp",
    "rtci-sframe",
    "rtci-shared",
    "rtci-srtp",
    "rtci-stun",
    "rtci-turn",
    "rtci-video",
    "rtci-video/interop",
    "examples/custom-runtime",
]
resolver = "2"

[profile.dev]
opt-level = 0

# The video pipeline's tests run minutes of virtual-time calls through two peer connections;
# unoptimised they take far longer. Only this package is optimised in the dev profile.
[profile.dev.package.rtci-video]
opt-level = 2

# rtci-video's codec backends (features `vp8`, `av1`): their tests encode and decode real video.
[profile.dev.package.vp8-decoder]
opt-level = 2

[profile.dev.package.vp8-encoder]
opt-level = 2

[profile.dev.package.rav1d]
opt-level = 2

[profile.dev.package.rav1e]
opt-level = 2

[workspace.package]
version = "0.3.0"
authors = ["Rain Liu <yliu@webrtc.rs>"]
edition = "2024"
# The lowest toolchain the workspace builds on (checked by the MSRV job of cargo.yml).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Brainwires/rtci"

[workspace.dependencies]
crypto = { version = "0.3.0", path = "rtci-crypto", package = "rtci-crypto", default-features = false }
datachannel = { version = "0.3.0", path = "rtci-datachannel", package = "rtci-datachannel" }
dtls = { version = "0.3.0", path = "rtci-dtls", package = "rtci-dtls", default-features = false }
ice = { version = "0.3.0", path = "rtci-ice", package = "rtci-ice", default-features = false }
interceptor = { version = "0.3.0", path = "rtci-interceptor", package = "rtci-interceptor" }
interceptor-derive = { version = "0.3.0", path = "rtci-interceptor-derive", package = "rtci-interceptor-derive" }
mdns = { version = "0.3.0", path = "rtci-mdns", package = "rtci-mdns" }
media = { version = "0.3.0", path = "rtci-media", package = "rtci-media" }
rtcp = { version = "0.3.0", path = "rtci-rtcp", package = "rtci-rtcp" }
rtp = { version = "0.3.0", path = "rtci-rtp", package = "rtci-rtp" }
sctp = { version = "0.3.0", path = "rtci-sctp", package = "rtci-sctp" }
sdp = { version = "0.3.0", path = "rtci-sdp", package = "rtci-sdp" }
sframe = { version = "0.3.0", path = "rtci-sframe", package = "rtci-sframe", default-features = false }
shared = { version = "0.3.0", path = "rtci-shared", package = "rtci-shared", default-features = false }
srtp = { version = "0.3.0", path = "rtci-srtp", package = "rtci-srtp", default-features = false }
stun = { version = "0.3.0", path = "rtci-stun", package = "rtci-stun", default-features = false }
turn = { version = "0.3.0", path = "rtci-turn", package = "rtci-turn", default-features = false }
# The examples' signalling helper is not published: path only, so `cargo publish` drops the
# root crate's dev-dependency on it.
signal = { path = "examples/signal", package = "rtci-signal" }
# The reference driver depends on `rtci` (its `peer` module), so the root crate's dev-dependency
# on it has no version (`cargo publish` drops it) and leaves that feature off.
stream-driver = { path = "examples/stream-driver", package = "rtci-stream-driver", default-features = false, features = ["runtime-tokio"] }

# common dependencies
sansio = "1"
bytes = "1.12.0"
byteorder = "1.5.0"
log = "0.4.33"
rcgen = { version = "0.14.8", features = ["pem"], default-features = false }
ring = "0.17.14"
aws-lc-rs = { version = "1.17.3", features = ["aws-lc-sys"], default-features = false }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.114"
thiserror = "2.0.18"
zeroize = { version = "1.8.2", features = ["derive"] }
pem = "3.0.3"
# `zeroize`: the expanded AES key schedules (`aes`) and the CTR keystream buffer (`ctr`, through
# `cipher`) are erased when dropped, including the per-packet ones on the stack.
aes = { version = "0.8.4", features = ["zeroize"] }
ctr = { version = "0.9.2", features = ["zeroize"] }
ccm = "0.5.0"
md-5 = "0.10.6"
# `zeroize` (here and in sha1): the hash states of the ring provider's HMAC-SHA1, and the copy
# of the outer state each MAC is finished on, are overwritten when dropped.
hmac = { version = "0.13.0", features = ["zeroize"] }
sha1 = { version = "0.11.0", features = ["zeroize"] }
sha2 = "0.10.9"
subtle = "2.6.1"
num-bigint = "0.4.6"
x509-parser = "0.16.0"
der-parser = "9.0.0"
rustls = { version = "0.23.27", default-features = false, features = ["std"] }
rkyv = "0.8.17"
bytecheck = "0.8"
url = "2.5.0"
base64 = "0.22.1"
crc = "3.0.1"
precis-profiles = "0.2.0"
slab = "0.4.9"
crc32c = "0.6"
rustc-hash = "2"
memchr = "2.1.1"
socket2 = { version = "0.6", features = ["all"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
uuid = { version = "1", features = ["v4"] }
unicase = "2.8"
substring = "1.4.5"

# dev dependencies
env_logger = "0.11.11"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.2"
criterion = "0.8.2"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = "0.28.0"
# HTTP/1 only: the examples' signaling servers and clients. No `http2`, so no `h2`.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
lazy_static = "1.4.0"
hex = "0.4.3"
crossbeam-channel = "0.5"
assert_matches = "1.5.0"
nearly_eq = "0.2"
regex = "1.10.3"
ipnet = "2.9.0"
waitgroup = "0.1.2"
futures = "0.3.30"
futures-util = "0.3"
local-sync = "0.1.1"
core_affinity = "0.8.1"
anyhow = "1.0.80"

[package]
name = "rtci"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A sans-I/O WebRTC implementation: peer connections with ICE, DTLS-SRTP, SCTP data channels, RTP/RTCP and JSEP negotiation"
license.workspace = true
repository.workspace = true
keywords = ["webrtc", "sans-io", "rtp", "ice", "dtls"]
categories = ["network-programming", "multimedia"]
readme = "README.md"
# The published crate is the library: its sources, the two test files its unit tests include,
# the README and the licence texts. The examples, integration tests, fixtures, documentation,
# test environment and CI files stay in the repository (`cargo publish` drops the example and
# test targets whose files are not in the package).
include = [
    "/src/**",
    "/tests/fixtures/browser-sdp/firefox-152--simulcast-three-rids-send--1-offer.sdp",
    "/tests/testdata/rsa_2048_offerer_key.pem",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[package.metadata.docs.rs]
features = ["crypto-ring", "crypto-aws-lc-rs", "pem", "turn-tls-webpki-roots"]

[features]
default = ["crypto-ring"]
crypto-ring = ["crypto/crypto-ring", "dtls/crypto-ring", "rustls/ring", "rcgen/ring", "ice/crypto-ring", "stun/crypto-ring", "srtp/crypto-ring", "turn/crypto-ring", "sframe/crypto-ring"]
# Kept by the Brainwires fork (upstream removed them): see FORK.md.
openssl = ["srtp/openssl"]
vendored-openssl = ["srtp/vendored-openssl"]
pem = ["dtls/pem"]
# The Mozilla root certificates (webpki-roots, CDLA-Permissive-2.0) for the engine's TURN-over-TLS
# connections; without it the application gives roots or a verifier (`with_turn_tls`).
turn-tls-webpki-roots = ["dep:webpki-roots"]
# Makes `BehaviourProfile::default()` (and with it every `SettingEngine`, `MediaEngine` and
# `DefaultInterceptorOptions` default) `BehaviourProfile::Chrome`: libwebrtc's defaults where
# they differ from the RFCs' (docs/behaviour-profiles.md). Cargo unifies features: one crate of
# a build that turns this on changes the defaults of every user of `rtci` in that build. Prefer
# `SettingEngineBuilder::with_behaviour_profile`.
chrome-defaults = []
# BehaviourProfile::Performance as the default profile (docs/behaviour-profiles.md). With
# chrome-defaults also on, Chrome is the default and the build warns.
performance-defaults = []
crypto-aws-lc-rs = ["crypto/crypto-aws-lc-rs", "dtls/crypto-aws-lc-rs", "rustls/aws-lc-rs", "rcgen/aws_lc_rs", "ice/crypto-aws-lc-rs", "stun/crypto-aws-lc-rs", "srtp/crypto-aws-lc-rs", "turn/crypto-aws-lc-rs", "sframe/crypto-aws-lc-rs"]

[dependencies]
shared = { workspace = true, default-features = false, features = ["marshal", "replay"] }
crypto.workspace = true
sansio.workspace = true
datachannel.workspace = true
dtls.workspace = true
ice.workspace = true
interceptor.workspace = true
mdns.workspace = true
media.workspace = true
rtcp.workspace = true
rtp.workspace = true
sctp.workspace = true
sdp.workspace = true
srtp.workspace = true
sframe.workspace = true
stun.workspace = true
turn.workspace = true

bytes.workspace = true
rustc-hash.workspace = true
log.workspace = true
serde.workspace = true
rcgen.workspace = true
# `tls12`: the engine's TURN-over-TLS client offers TLS 1.2 beside TLS 1.3 (RFC 8656 3.1 allows
# both). Deployed servers still need it: coturn 4.6.1, which Ubuntu 24.04 and Debian 13 ship,
# refuses a ClientHello that offers TLS 1.3 alone and settles on TLS 1.2 when both are offered
# (fixed in coturn 4.6.2, https://github.com/coturn/coturn/pull/989).
rustls = { workspace = true, features = ["tls12"] }
url.workspace = true
# Feature `turn-tls-webpki-roots`: the Mozilla roots for TURN over TLS.
webpki-roots = { version = "1", optional = true }
hex.workspace = true
base64.workspace = true
pem.workspace = true
x509-parser.workspace = true
unicase.workspace = true
rand.workspace = true

[dev-dependencies]
sansio.workspace = true
shared.workspace = true
ice.workspace = true
signal.workspace = true
stream-driver.workspace = true

tokio.workspace = true
env_logger.workspace = true
anyhow.workspace = true
clap.workspace = true
hyper.workspace = true
chrono.workspace = true
log.workspace = true
ctrlc.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
# The statistics tests and the interop peer read and write JSON.
serde_json.workspace = true

# Interop tests against the independent (pre-sans-I/O) webrtc implementation. 0.17.3 is the
# last release of that line, and the first whose DTLS uses p256 0.14 (crypto-bigint 0.7, past
# RUSTSEC-2026-0387) and no bincode. webrtc 0.20+ is built on the upstream `rtc` crates, so it
# would test this stack against its own lineage.
webrtc = "0.17.3"

# The integration tests name TLS 1.2 themselves (tests/testenv_turn_streams.rs checks that the
# environment's TLS 1.2-only coturn settles on 1.2). The same feature as the library's own
# dependency above, which is what the engine's TURN-over-TLS client needs.
rustls = { workspace = true, features = ["tls12"] }

# The real-network test environment's tests (tests/testenv_*.rs) create sockets inside Linux
# network namespaces with setns(2).
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

