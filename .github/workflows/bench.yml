name: Benchmarks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# `bash` (not the default `bash -e`) adds `-o pipefail`, so a failing
# `cargo bench` fails its step instead of being hidden by `tee`.
defaults:
  run:
    shell: bash

jobs:
  benchmark:
    name: Run criterion benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-

      # Only the criterion `bench` target of each crate: `--output-format bencher`
      # is a criterion flag that libtest (the lib/test targets `cargo bench` also
      # runs) rejects. The bencher lines on stdout are what `tool: cargo` parses;
      # cargo's own stderr stays in the log only.
      - name: Run benchmarks (rtc-rtp)
        run: cargo bench -p rtc-rtp --bench bench -- --output-format bencher | tee -a bench-all.txt

      - name: Run benchmarks (rtc-rtcp)
        run: cargo bench -p rtc-rtcp --bench bench -- --output-format bencher | tee -a bench-all.txt

      - name: Run benchmarks (rtc-stun)
        run: cargo bench -p rtc-stun --bench bench -- --output-format bencher | tee -a bench-all.txt

      - name: Run benchmarks (rtc-sdp)
        run: cargo bench -p rtc-sdp --bench bench -- --output-format bencher | tee -a bench-all.txt

      - name: Run benchmarks (rtc-srtp)
        run: cargo bench -p rtc-srtp --bench bench -- --output-format bencher | tee -a bench-all.txt

      - name: Run benchmarks (rtc-turn)
        run: cargo bench -p rtc-turn --bench bench -- --output-format bencher | tee -a bench-all.txt

      - name: Run benchmarks (rtc-media)
        run: cargo bench -p rtc-media --bench bench -- --output-format bencher | tee -a bench-all.txt

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: WebRTC-RS Criterion Benchmarks
          tool: cargo
          output-file-path: bench-all.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Alert if performance degrades by more than 10%
          alert-threshold: '110%'
          comment-on-alert: true
          fail-on-alert: false
          benchmark-data-dir-path: docs/benchmarks
