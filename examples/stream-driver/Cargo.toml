[package]
name = "rtci-stream-driver"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A socket driver for a sans-I/O WebRTC engine (ICE-TCP, TURN over TCP and TLS, whole peer connections) on an async runtime of your choice"
license.workspace = true
repository.workspace = true
keywords = ["webrtc", "tokio", "tcp", "ice-tcp", "turn"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
# SRV and NAPTR lookups for `StreamCommand::ResolveRecords` (RFC 5928, RFC 8489 section 8)
# and AAAA / A answered separately (`StreamEvent::ResolvedFamily`, RFC 8305 section 3), with
# hickory-resolver (MIT OR Apache-2.0). Without it records are answered as none and both
# families together, through the system resolver. hickory 0.26.2 or later: 0.25 carries
# RUSTSEC-2026-0491 (memory amplification from a response's record counts, reachable from any
# name server the client asks) and DNSSEC advisories (not compiled in: no `dnssec-*` feature).
# They are lookups of the tokio runtime (`TokioRuntime::resolve_family` / `resolve_records`), so
# the feature turns `runtime-tokio` on.
dns-records = ["runtime-tokio", "dep:hickory-resolver"]
# `peer`: a whole `rtci` peer connection driven over sockets the driver owns, UDP included,
# gathering again by itself when a transport needs new candidates (`OnLocalCandidatesNeeded`).
# On by default. `rtci` dev-depends on this crate without a version and without this feature,
# so the two are published in the order rtc, then rtci-stream-driver.
default = ["peer", "runtime-tokio"]
peer = ["dep:rtci", "dep:bytes"]
# Built-in runtime types (`runtime::TokioRuntime`). Features only decide which types exist,
# never what the driver uses: a driver runs on the `Arc<dyn Runtime>` it is given. With none
# the crate builds without any async runtime, for an application's own (`custom-runtime`).
runtime-tokio = ["dep:tokio"]
runtime-smol = ["dep:smol"]
# `MockRuntime`: a virtual clock and an in-memory network, for tests on virtual time.
runtime-mock = ["dep:async-task"]

[dependencies]
shared = { workspace = true, default-features = false, features = ["ifaces"] }
tokio = { workspace = true, optional = true }
socket2.workspace = true
# One warning: a loopback join of the mDNS group on Windows (`runtime::std_multicast`).
log.workspace = true
async-channel = "2.5"
smol = { version = "2.0", optional = true }
async-task = { version = "4.7", optional = true }
hickory-resolver = { version = "0.26.2", optional = true, default-features = false, features = ["tokio", "system-config"] }
rtci = { version = "0.3.0", path = "../..", optional = true }
bytes = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# EINPROGRESS of a non-blocking connect (`runtime::std_tcp_connect_start`).
libc = "0.2"

[dev-dependencies]
env_logger.workspace = true
tokio.workspace = true

# The `peer` module's tests need the feature (on by default; off in the workspace jobs that
# build with `--no-default-features`), and these tests run on tokio.
[[test]]
name = "peer"
required-features = ["peer", "runtime-tokio"]

[[test]]
name = "mdns"
required-features = ["peer", "runtime-tokio"]

[[test]]
name = "runtimes"
required-features = ["peer", "runtime-tokio", "runtime-smol"]

[[test]]
name = "virtual_time"
required-features = ["peer", "runtime-mock"]

[[test]]
name = "mdns_virtual_time"
required-features = ["peer", "runtime-mock"]

[[test]]
name = "mdns_failures"
required-features = ["peer", "runtime-mock"]

[[test]]
name = "mdns_shutdown"
required-features = ["peer", "runtime-mock"]

[[test]]
name = "mdns_budget"
required-features = ["peer", "runtime-mock"]

[[test]]
name = "mdns_unavailable"
required-features = ["peer", "runtime-tokio"]

[[test]]
name = "loopback"
required-features = ["runtime-tokio"]

[[test]]
name = "sockets"
required-features = ["runtime-tokio"]

[[test]]
name = "mdns_fail_closed"
required-features = ["peer", "runtime-tokio"]

[[test]]
name = "mdns_temporary"
required-features = ["peer", "runtime-tokio"]
