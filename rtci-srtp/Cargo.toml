[package]
name = "rtci-srtp"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sans-I/O SRTP and SRTCP (RFC 3711, RFC 7714 AES-GCM, RFC 9335 Cryptex) for WebRTC"
license.workspace = true
repository.workspace = true
keywords = ["webrtc", "srtp", "srtcp", "rtp", "encryption"]
categories = ["cryptography", "network-programming", "multimedia"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["crypto-ring", "crypto-aws-lc-rs"]

[features]
default = ["crypto-ring"]
crypto-ring = ["crypto/crypto-ring"]
crypto-aws-lc-rs = ["crypto/crypto-aws-lc-rs"]
# Kept by the Brainwires fork (upstream removed them): AES-CM keystream from OpenSSL.
openssl = ["crypto/openssl"]
vendored-openssl = ["crypto/vendored-openssl"]

[dependencies]
shared = { workspace = true, default-features = false, features = ["marshal", "replay"] }
rtp.workspace = true
rtcp.workspace = true
crypto.workspace = true

bytes.workspace = true
zeroize.workspace = true

[dev-dependencies]
criterion.workspace = true
lazy_static.workspace = true

# tests/key_residue.rs runs key handling on threads whose stacks the test maps itself
# (mmap, pthread_attr_setstack) and, on Linux, reads the process through /proc.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "bench"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(fuzzing)'
] }
