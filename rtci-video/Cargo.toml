[package]
name = "rtci-video"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sans-I/O video pipeline for RTC: frame assembly, frame reference finding, a jitter buffer with playout timing, key-frame requests and the W3C video statistics"
license.workspace = true
repository.workspace = true
keywords = ["webrtc", "video", "jitter-buffer", "rtp", "sans-io"]
categories = ["multimedia::video", "network-programming"]
readme = "README.md"
# Not part of the 0.1.0 release: the pipeline is in development (docs/video-pipeline.md, phases).
publish = false

[package.metadata.docs.rs]
features = ["engine", "vp8", "av1", "isolation", "libvpx", "dav1d", "openh264"]

# The default features are pure Rust and need no system library: the workspace's CI installs
# none. The default build has no codec at all (it assembles, times and requests key frames for
# every payload format, and decodes nothing): each codec is a feature the application chooses.
# docs/video-pipeline.md 4.6 has the evidence for each codec feature and 4.7 the supply chain.
[features]
default = ["engine"]
# The glue that connects the receive pipeline to an `RTCRtpReceiver` of the `rtci` peer
# connection. Without it the crate has no dependency on the engine.
engine = ["dep:rtci"]
# VP8 decode and encode in pure Rust (`vp8-decoder` / `vp8-encoder`, pinned to an exact version).
# Opt-in until the owner decides on the supply chain of these crates (weeks old, one publisher):
# docs/video-pipeline.md 4.7 has the facts and the recommendation.
vp8 = ["dep:vp8-decoder", "dep:vp8-encoder"]
# AV1 decode (`rav1d`) and encode (`rav1e`) in pure Rust, without their assembly (which needs
# NASM). WARNING: with rav1d 1.1.0 a malformed AV1 frame from the peer aborts the whole process
# (a panic inside rav1d's C API, which no caller can catch; memorysafety/rav1d issue 1497, fixed
# on its main branch, not released). Enable it only for senders you trust, or decode in a
# separate process. rav1d 1.1.0 also leaks about 50 to 100 bytes a frame (rav1d issue 1522).
# rav1e is not real time without assembly. docs/video-pipeline.md 4.6, 4.8.
av1 = ["dep:rav1d", "dep:rav1e", "dep:libc"]
# `codec::isolated`: runs a decoder in a child process, so that a decoder that crashes, aborts
# or hangs on a hostile frame costs that frame, not the application. No dependency; it is the
# one part of the crate that starts a process and a thread, and only when the application asks.
isolation = []
# The system-library backends: each LOADS its library at run time (dlopen), so building any of
# them needs no library, no headers and no C toolchain (the workspace's `cargo check
# --all-features` stays pure Rust); running needs the library installed. docs/video-pipeline.md
# 4.9.
# VP8 / VP9 decode and encode with libvpx (BSD-3-Clause).
libvpx = ["dep:libloading"]
# AV1 decode with libdav1d (BSD-2-Clause), the browsers' decoder.
dav1d = ["dep:libloading", "dep:libc"]
# H.264 decode and encode with Cisco's OpenH264 BINARY only, loaded from a path the application
# gives, accepted only if its SHA-256 is one Cisco published. Never built from source here. The
# patent licence comes with Cisco's binary under Cisco's conditions, which the application must
# meet (codec::openh264 and docs/video-pipeline.md 4.1).
openh264 = ["dep:openh264"]

[dependencies]
rtp.workspace = true
shared = { workspace = true, default-features = false, features = ["marshal"] }
bytes.workspace = true
log.workspace = true
thiserror.workspace = true

# The engine with its default crypto backend (ring); `rtci` has no build without one.
rtci = { version = "0.3.0", path = "..", optional = true }

vp8-decoder = { version = "=0.1.3", optional = true }
vp8-encoder = { version = "=0.1.3", optional = true }
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8"], optional = true }
rav1e = { version = "0.8.1", default-features = false, optional = true }
# The errno values rav1d's C API returns (bindings only, no C code).
libc = { version = "0.2", optional = true }
libloading = { version = "0.9.1", optional = true }
# Without its default `source` feature: no C is compiled, Cisco's binary is loaded at run time.
openh264 = { version = "0.9.10", default-features = false, features = ["libloading"], optional = true }

[dev-dependencies]
rtci = { version = "0.3.0", path = ".." }
media.workspace = true
anyhow.workspace = true

[[example]]
name = "codec_check"
path = "examples/codec_check.rs"
required-features = ["vp8", "av1"]

[[test]]
name = "codecs"
path = "tests/codecs.rs"
required-features = ["vp8", "av1"]

[[test]]
name = "libvpx"
path = "tests/libvpx.rs"
required-features = ["libvpx", "vp8"]

[[test]]
name = "dav1d"
path = "tests/dav1d.rs"
required-features = ["dav1d", "av1"]

[[test]]
name = "openh264"
path = "tests/openh264.rs"
required-features = ["openh264"]

[[test]]
name = "isolated"
path = "tests/isolated.rs"
required-features = ["isolation", "av1"]

[[test]]
name = "send_rtc2rtc"
path = "tests/send_rtc2rtc.rs"
required-features = ["engine", "vp8"]

[[test]]
name = "receive_rtc2rtc"
path = "tests/receive_rtc2rtc.rs"
required-features = ["engine"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(fuzzing)'
] }
